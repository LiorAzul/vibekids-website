<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VibeKids - הדור החדש של המתכנתים</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #050508;
            --surface: rgba(255,255,255,0.04);
            --surface-hover: rgba(255,255,255,0.08);
            --border: rgba(255,255,255,0.1);
            --border-strong: rgba(255,255,255,0.2);
            --text: #fff;
            --text-dim: rgba(255,255,255,0.6);
            --text-muted: rgba(255,255,255,0.4);
            --accent: #6366f1;
            --accent-glow: rgba(99,102,241,0.3);
            --glass-blur: 20px;
            --glass-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
            --radius: 20px;
            --radius-sm: 12px;
            --radius-full: 100px;
            --nav-height: 72px;
            --top-height: 56px;
        }
        body.light {
            --bg: #f0f2f5;
            --surface: rgba(255,255,255,0.6);
            --surface-hover: rgba(255,255,255,0.8);
            --border: rgba(0,0,0,0.08);
            --border-strong: rgba(0,0,0,0.15);
            --text: #1a1a2e;
            --text-dim: rgba(26,26,46,0.6);
            --text-muted: rgba(26,26,46,0.35);
            --glass-shadow: 0 8px 32px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.8);
        }

        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        html{height:100%}
        body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100%;overflow-x:hidden;transition:background .4s,color .4s;-webkit-font-smoothing:antialiased}

        /* === SHADER BG === */
        #shader-bg{position:fixed;inset:0;z-index:0;opacity:.35;pointer-events:none}
        body.light #shader-bg{opacity:.15}

        /* === GLASS === */
        .glass{background:var(--surface);backdrop-filter:blur(var(--glass-blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);border:1px solid var(--border);box-shadow:var(--glass-shadow);border-radius:var(--radius);transition:all .3s ease}
        .glass:hover{border-color:var(--border-strong)}

        /* === GLASS BTN === */
        .glass-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--radius-full);color:var(--text);font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;text-decoration:none;transition:all .3s ease;overflow:hidden;white-space:nowrap}
        .glass-btn::before{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 2px 2px 4px rgba(255,255,255,.15),inset -1px -1px 3px rgba(255,255,255,.05);pointer-events:none}
        .glass-btn:hover{transform:translateY(-2px);border-color:var(--border-strong);box-shadow:0 8px 24px rgba(0,0,0,.2)}
        .glass-btn:active{transform:scale(.97)}
        .glass-btn.primary{background:rgba(99,102,241,.2);border-color:rgba(99,102,241,.3)}
        .glass-btn.primary:hover{background:rgba(99,102,241,.35);box-shadow:0 0 30px var(--accent-glow)}
        .glass-btn.whatsapp{background:rgba(37,211,102,.15);border-color:rgba(37,211,102,.3)}
        .glass-btn.whatsapp:hover{background:rgba(37,211,102,.3)}
        .glass-btn.small{padding:8px 16px;font-size:.85rem}

        /* === HERO SECTION === */
        #hero{position:relative;min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px 40px;z-index:10}
        .hero-logo{width:220px;max-width:70%;filter:invert(1);transition:filter .4s;margin-bottom:16px}
        body.light .hero-logo{filter:invert(0)}
        .hero-greeting{font-size:1.3rem;font-weight:600;color:var(--text-dim);text-align:center;min-height:1.6em}
        .hero-corner-btn{position:absolute;top:20px;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-dim);transition:all .3s;overflow:hidden;font-size:.95rem}
        .hero-corner-btn:hover{border-color:var(--border-strong);transform:scale(1.08)}
        .hero-corner-btn img{width:100%;height:100%;object-fit:cover}
        .hero-corner-btn svg{width:18px;height:18px}
        #heroAvatar{right:20px}
        #heroTheme{left:20px}

        /* === SCROLL HEADER === */
        #top-bar{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--top-height);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(5,5,8,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);transform:translateY(-100%);opacity:0;transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .3s ease;pointer-events:none}
        body.light #top-bar{background:rgba(240,242,245,.7)}
        #top-bar.visible{transform:translateY(0);opacity:1;pointer-events:auto}
        .top-logo{height:26px;filter:invert(1);transition:filter .4s}
        body.light .top-logo{filter:invert(0)}
        #top-bar.visible .top-logo{animation:logoScale .5s cubic-bezier(.34,1.56,.64,1)}
        @keyframes logoScale{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
        .avatar-btn{width:34px;height:34px;border-radius:50%;border:2px solid var(--border-strong);background:var(--surface);overflow:hidden;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:.9rem}
        .avatar-btn img{width:100%;height:100%;object-fit:cover}
        .avatar-btn:hover{border-color:var(--accent);transform:scale(1.05)}

        /* === CONTENT === */
        #content{position:relative;z-index:10;padding-bottom:calc(var(--nav-height) + 20px);min-height:100vh}
        .page{display:none;padding:0 16px;max-width:600px;margin:0 auto;animation:fadeIn .3s ease}
        .page.active{display:block}
        #page-community{padding-top:0}
        .page:not(#page-community){padding-top:calc(var(--top-height) + 16px)}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

        /* === BOTTOM NAV === */
        #bottom-nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:2px;padding:6px;background:rgba(20,20,30,.75);backdrop-filter:blur(25px) saturate(180%);-webkit-backdrop-filter:blur(25px) saturate(180%);border:1px solid var(--border);border-radius:var(--radius-full);box-shadow:0 8px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);height:52px}
        body.light #bottom-nav{background:rgba(255,255,255,.75);box-shadow:0 8px 40px rgba(0,0,0,.1)}
        .nav-item{display:flex;align-items:center;gap:0;padding:0 12px;height:40px;min-width:40px;border-radius:var(--radius-full);cursor:pointer;color:var(--text-muted);font-size:.75rem;font-weight:600;transition:all .35s cubic-bezier(.34,1.56,.64,1);background:transparent;border:none;font-family:inherit;overflow:hidden;white-space:nowrap}
        .nav-item:active{transform:scale(.95)}
        .nav-item svg{width:22px;height:22px;flex-shrink:0;transition:color .2s}
        .nav-item .nav-label{display:inline-block;max-width:0;opacity:0;overflow:hidden;margin-right:0;transition:max-width .35s cubic-bezier(.34,1.56,.64,1),opacity .2s ease,margin-right .35s cubic-bezier(.34,1.56,.64,1)}
        .nav-item.active{color:var(--accent);background:rgba(99,102,241,.12);gap:0}
        body.light .nav-item.active{background:rgba(99,102,241,.1)}
        .nav-item.active .nav-label{max-width:80px;opacity:1;margin-right:8px}

        /* === SECTIONS === */
        .section-title{font-size:1.5rem;font-weight:800;margin:28px 0 16px;color:var(--text)}
        .section-title:first-child{margin-top:8px}

        .sub-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
        .sub-tabs::-webkit-scrollbar{display:none}
        .sub-tab{padding:8px 18px;border-radius:var(--radius-full);font-size:.85rem;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);cursor:pointer;white-space:nowrap;transition:all .3s;font-family:inherit}
        .sub-tab.active{background:rgba(99,102,241,.2);border-color:rgba(99,102,241,.3);color:var(--text)}

        .search-box{width:100%;padding:12px 18px;background:var(--surface);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--radius-full);color:var(--text);font-family:inherit;font-size:.95rem;outline:none;margin-bottom:16px;transition:all .3s}
        .search-box::placeholder{color:var(--text-muted)}
        .search-box:focus{border-color:var(--accent);box-shadow:0 0 20px var(--accent-glow)}

        /* === APP CARD === */
        .app-card{padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none;color:var(--text)}
        .app-card:hover{transform:translateY(-2px)}
        .app-icon{width:48px;height:48px;border-radius:14px;background:var(--surface-hover);border:1px solid var(--border);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
        .app-icon img{width:100%;height:100%;object-fit:cover}
        .app-info{flex:1;min-width:0}
        .app-name{font-size:.95rem;font-weight:700;margin-bottom:2px}
        .app-desc{font-size:.82rem;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .app-badge{font-size:.65rem;padding:2px 8px;border-radius:20px;background:rgba(99,102,241,.15);color:var(--accent);font-weight:600;display:inline-block;margin-right:6px}
        .app-creator{display:flex;align-items:center;gap:6px;flex-shrink:0}
        .app-creator-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
        .app-creator-name{font-size:.75rem;color:var(--text-muted);max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

        /* === PROMPT CARD === */
        .prompt-card{padding:16px;margin-bottom:10px;cursor:pointer}
        .prompt-card:hover{transform:translateY(-2px)}
        .prompt-title{font-size:1rem;font-weight:700;margin-bottom:6px}
        .prompt-preview{font-size:.85rem;color:var(--text-dim);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .show-more-btn{display:block;width:100%;padding:12px;text-align:center;font-size:.9rem;font-weight:600;color:var(--accent);cursor:pointer;border-radius:var(--radius);background:transparent;border:1px dashed var(--border);font-family:inherit;transition:all .3s}
        .show-more-btn:hover{background:var(--surface);border-style:solid}

        /* === GUIDE === */
        .guide-card{padding:20px;margin-bottom:12px}
        .guide-title{font-size:1.1rem;font-weight:700;margin-bottom:12px}
        .pdf-frame{width:100%;height:400px;border-radius:var(--radius-sm);border:1px solid var(--border);background:rgba(0,0,0,.3);overflow:hidden}
        .pdf-frame iframe{width:100%;height:100%;border:none}

        /* === TOOLS === */
        .tools-grid{display:flex;flex-direction:column;gap:8px}
        .tool-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);text-decoration:none;color:var(--text);transition:all .3s}
        .tool-row:hover{background:var(--surface-hover);transform:translateX(-4px)}
        .tool-favicon{width:28px;height:28px;border-radius:6px;object-fit:contain}
        .tool-name{font-weight:600;font-size:.9rem;flex:1}
        .tool-desc{font-size:.8rem;color:var(--text-dim);max-width:50%;text-align:left}

        /* === MEMBERS === */
        .members-scroll{display:flex;gap:16px;overflow-x:auto;padding:8px 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
        .members-scroll::-webkit-scrollbar{display:none}
        .member-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex-shrink:0;transition:transform .2s}
        .member-item:hover{transform:scale(1.05)}
        .member-avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--border);background:var(--surface)}
        .member-name{font-size:.75rem;color:var(--text-dim);max-width:64px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

        /* === NEWS === */
        .news-card{padding:16px;margin-bottom:12px;display:flex;gap:14px;text-decoration:none;color:var(--text);direction:ltr;text-align:left}
        .news-card:hover{transform:translateY(-2px)}
        .news-thumb{width:80px;height:80px;border-radius:var(--radius-sm);object-fit:cover;flex-shrink:0;background:var(--surface-hover);border:1px solid var(--border)}
        .news-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
        .news-source{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:600;color:var(--accent);margin-bottom:6px;letter-spacing:.02em;text-transform:uppercase}
        .news-source-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0}
        .news-title{font-size:1.05rem;font-weight:800;line-height:1.4;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .news-link{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:600;color:var(--accent);text-decoration:none;transition:gap .2s;margin-top:auto}
        .news-link:hover{gap:8px}
        .news-link svg{width:14px;height:14px}

        /* === PROFILE PAGE === */
        .profile-header{text-align:center;padding:20px 0 10px}
        .profile-avatar-lg{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid var(--border);margin-bottom:10px;background:var(--surface)}
        .profile-name-lg{font-size:1.3rem;font-weight:800}
        .profile-username-lg{font-size:.85rem;color:var(--text-dim);margin-top:2px}
        .profile-bio-lg{font-size:.9rem;color:var(--text-dim);margin-top:8px;line-height:1.5}

        /* === APP DETAIL PAGE === */
        .app-detail-icon{width:96px;height:96px;border-radius:24px;object-fit:contain;margin-bottom:16px;border:1px solid var(--border);background:var(--surface)}

        /* === BACK BTN === */
        .back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 0;background:none;border:none;color:var(--accent);font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;margin-bottom:8px}
        .back-btn svg{width:18px;height:18px;transform:scaleX(-1)}

        /* === AVATAR UPLOAD === */
        .avatar-upload{position:relative;display:inline-block;cursor:pointer;margin-bottom:16px}
        .avatar-upload-img{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid var(--border);background:var(--surface);display:block;margin:0 auto}
        .avatar-upload-badge{position:absolute;bottom:0;right:calc(50% - 40px);width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);font-size:.8rem}
        .avatar-upload input[type=file]{display:none}

        /* === REPORT BTN === */
        .report-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-full);background:transparent;border:1px solid rgba(239,68,68,.2);color:rgba(239,68,68,.7);font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .3s;margin-top:12px}
        .report-btn:hover{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4);color:#ef4444}
        .report-btn svg{width:16px;height:16px}

        /* === MODALS === */
        .modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);align-items:flex-end;justify-content:center}
        .modal-overlay.open{display:flex}
        .modal-content{width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding:24px 24px 40px;border-radius:24px 24px 0 0;background:rgba(20,20,30,.95);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--border);border-bottom:none;box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:slideUp .3s ease}
        body.light .modal-content{background:rgba(255,255,255,.95)}
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .modal-handle{width:40px;height:4px;background:var(--text-muted);border-radius:2px;margin:0 auto 20px}
        .modal-title{font-size:1.3rem;font-weight:800;margin-bottom:20px;text-align:center}

        .form-group{margin-bottom:16px}
        .form-label{display:block;font-size:.85rem;font-weight:600;color:var(--text-dim);margin-bottom:6px}
        .form-input{width:100%;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:inherit;font-size:.95rem;outline:none;transition:all .3s}
        .form-input:focus{border-color:var(--accent)}
        textarea.form-input{min-height:120px;resize:vertical}

        .post-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);margin-bottom:8px}
        .post-item-icon{width:32px;height:32px;border-radius:8px;object-fit:contain;flex-shrink:0;border:1px solid var(--border)}
        .post-item-title{font-weight:600;font-size:.85rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .post-action-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
        .post-action-btn.delete:hover{background:rgba(239,68,68,.2);color:#ef4444}

        .create-options{display:flex;flex-direction:column;gap:12px}
        .create-option{display:flex;align-items:center;gap:16px;padding:20px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:all .3s;color:var(--text);font-family:inherit;font-size:1rem;font-weight:600;text-align:right}
        .create-option:hover{background:var(--surface-hover);transform:translateY(-2px)}
        .create-option-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

        .google-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px;border-radius:var(--radius-full);background:#fff;color:#333;font-family:inherit;font-size:1rem;font-weight:600;border:none;cursor:pointer;transition:all .3s;box-shadow:0 4px 12px rgba(0,0,0,.1)}
        .google-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.15)}
        .google-btn svg{width:20px;height:20px}

        .empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
        .empty-state-icon{font-size:2.5rem;margin-bottom:12px}
        .empty-state-text{font-size:.95rem;line-height:1.6}

        .spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
        @keyframes spin{to{transform:rotate(360deg)}}

        .favicon-preview{text-align:center;margin:12px 0}
        .favicon-preview img{width:64px;height:64px;border-radius:16px;border:1px solid var(--border);background:var(--surface)}
        .favicon-preview-label{font-size:.75rem;color:var(--text-muted);margin-top:4px}

        ::-webkit-scrollbar{width:4px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:var(--text-muted);border-radius:2px}
        @media(min-width:768px){.page{max-width:640px}.nav-item{padding:8px 28px}}
    </style>
</head>
<body>

<div id="shader-bg"></div>

<!-- Scroll Header (hidden by default) -->
<div id="top-bar">
    <div><img src="vibekids logo.svg" alt="VibeKids" class="top-logo"></div>
    <button class="avatar-btn" id="headerAvatar" onclick="handleAvatarClick()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </button>
</div>

<div id="content">

    <!-- ===== PAGE: COMMUNITY ===== -->
    <div class="page active" id="page-community">

        <!-- Hero -->
        <div id="hero">
            <button class="hero-corner-btn" id="heroTheme" onclick="toggleTheme()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>

function getFavicon(url, size = 64) {
    if (!url) return '';
    try {
        const u = new URL(url);
        const host = u.hostname;
        const path = u.pathname;

        // App Store: extract icon from iTunes API
        if (host.includes('apps.apple.com')) {
            const idMatch = path.match(/\/id(\d+)/);
            if (idMatch) return `https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/placeholder.png/512x512bb.jpg`;
            // Will be replaced async by fetchAppStoreIcon
        }

        // Play Store: use Google favicon (best we can do client-side)
        if (host.includes('play.google.com')) {
            const pkgMatch = path.match(/id=([^&]+)/) || u.searchParams.get('id');
            // Google favicon service gives the Play Store icon
        }

        return `https://www.google.com/s2/favicons?domain=${host}&sz=${size}`;
    } catch { return ''; }
}

// Smart icon fetching: resolve App Store / Play Store icons via their APIs
async function resolveAppIcon(url) {
    if (!url) return '';
    try {
        const u = new URL(url);

        // App Store → iTunes Lookup API
        if (u.hostname.includes('apps.apple.com')) {
            const idMatch = u.pathname.match(/\/id(\d+)/);
            if (idMatch) {
                const res = await fetch(`https://itunes.apple.com/lookup?id=${idMatch[1]}`);
                const data = await res.json();
                if (data.results?.[0]?.artworkUrl512) return data.results[0].artworkUrl512;
                if (data.results?.[0]?.artworkUrl100) return data.results[0].artworkUrl100;
            }
        }

        // Play Store → Google favicon (there's no public API, but Google's favicon service works)
        if (u.hostname.includes('play.google.com')) {
            return `https://www.google.com/s2/favicons?domain=play.google.com&sz=128`;
        }

        // Default: Google favicon service
        return `https://www.google.com/s2/favicons?domain=${u.hostname}&sz=128`;
    } catch { return getFavicon(url, 128); }
}
function getAppUrl(a) { return a.website_url || a.app_store_url || a.play_store_url || ''; }

    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + page)?.classList.add('active');
    document.querySelectorAll('.nav-item[data-page]').forEach(n => n.classList.remove('active'));
    document.querySelector(`.nav-item[data-page="${page}"]`)?.classList.add('active');

    const topBar = document.getElementById('top-bar');
    if (page !== 'community') topBar.classList.add('visible');
    // For community, the IntersectionObserver handles it

    if (page === 'world' && document.querySelector('#newsList .spinner')) loadNews();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function initSubTabs() {

function handleAppSearch() {
    const q = document.getElementById('appsSearchInput').value.trim().toLowerCase();
    if (!q) return renderApps(appsData);
    renderApps(appsData.filter(a => a.name.toLowerCase().includes(q) || (a.description||'').toLowerCase().includes(q) || (a._creatorName||'').toLowerCase().includes(q)));

async function loadApps() {
    try {
        const { data } = await sb.from('apps').select('*, profiles(id, display_name, username, avatar_url)').order('created_at', { ascending: false });
        appsData = (data || []).map(a => ({ ...a, _creatorName: a.profiles?.display_name || a.profiles?.username || '' }));

function renderApps(apps) {
    const el = document.getElementById('appsList');
    if (!apps.length) { el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📱</div><div class="empty-state-text">עדיין אין אפליקציות. היה הראשון לשתף!</div></div>'; return; }
    el.innerHTML = apps.map(a => {
        const url = getAppUrl(a);
        const fav = a.icon_url || getFavicon(url);
        const p = a.profiles;
        return `<div class="app-card glass" onclick="showAppDetail('${a.id}')">
            <div class="app-icon"><img src="${esc(fav)}" alt="" data-resolve-url="${esc(url)}" onerror="this.parentElement.innerHTML='📱'"></div>
            <div class="app-info">
                <div class="app-name">${esc(a.name)} ${a.status ? `<span class="app-badge">${esc(a.status)}</span>` : ''}</div>
                <div class="app-desc">${esc(a.description||'')}</div>
            </div>
            ${p ? `<div class="app-creator" onclick="event.stopPropagation();showProfile('${p.id}')">
                <span class="app-creator-name">${esc(p.display_name||p.username||'')}</span>
                <img class="app-creator-avatar" src="${esc(p.avatar_url||'')}" alt="" onerror="this.style.display='none'">
            </div>` : ''}
        </div>`;
    }).join('');

    // Async: resolve smart icons for App Store / Play Store links
    el.querySelectorAll('img[data-resolve-url]').forEach(async img => {
        const url = img.dataset.resolveUrl;
        if (!url) return;
        try {
            const u = new URL(url);
            if (u.hostname.includes('apps.apple.com') || u.hostname.includes('play.google.com')) {
                const resolved = await resolveAppIcon(url);
                if (resolved && img.parentElement) img.src = resolved;
            }
        } catch {}
    });
}

// ====== AVATAR UPLOAD ======
async function uploadAvatar(event) {
    const file = event.target.files[0];
    if (!file || !currentUser || !userProfile) return;

    // Preview immediately
    const reader = new FileReader();
    reader.onload = e => { document.getElementById('profileAvatarPreview').src = e.target.result; };
    reader.readAsDataURL(file);

    // Upload to Supabase Storage
    const ext = file.name.split('.').pop();
    const path = `avatars/${userProfile.id}.${ext}`;
    try {
        const { error: upErr } = await sb.storage.from('avatars').upload(path, file, { upsert: true, contentType: file.type });
        if (upErr) throw upErr;

        const { data: urlData } = sb.storage.from('avatars').getPublicUrl(path);
        const avatarUrl = urlData.publicUrl + '?t=' + Date.now(); // cache bust

        const { error: dbErr } = await sb.from('profiles').update({ avatar_url: avatarUrl }).eq('id', userProfile.id);
        if (dbErr) throw dbErr;

        userProfile.avatar_url = avatarUrl;
        updateUI();
    } catch (e) {
        alert('שגיאה בהעלאת תמונה: ' + e.message);
    }
}

async function submitCreate() {
    if (!currentUser || !userProfile) return;
    const name = document.getElementById('createName')?.value.trim();
    if (!name) { alert('נא למלא שם/כותרת'); return; }
    const btn = document.getElementById('createFormSubmit');
    btn.textContent = 'מפרסם...'; btn.disabled = true;
    try {
        if (createType === 'app') {
            const url = document.getElementById('createUrl')?.value.trim();
            if (!url) { alert('נא למלא קישור'); return; }
            const { error } = await sb.from('apps').insert({ name, website_url: url, description: document.getElementById('createDesc')?.value.trim() || '', profile_id: userProfile.id });
            if (error) throw error;
        } else {
            const content = document.getElementById('createContent')?.value.trim();
            if (!content) { alert('נא למלא תוכן'); return; }
            const { error } = await sb.from('prompts').insert({ title: name, content, profile_id: userProfile.id });
            if (error) throw error;
        }
        closeAllModals();
        await Promise.all([loadApps(), loadPrompts()]);
        switchPage('community');
    } catch (e) { alert('שגיאה: ' + e.message); }
    finally { btn.textContent = 'פרסם'; btn.disabled = false; }
}

// ====== MODALS ======
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function closeAllModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open')); }
document.querySelectorAll('.modal-overlay').forEach(m => { m.addEventListener('click', () => m.classList.remove('open')); });

// ====== UI UPDATE ======
function updateUI() {
    const firstName = userProfile?.display_name?.split(' ')[0] || '';
    const greeting = getGreeting(firstName);
    document.getElementById('heroGreeting').textContent = greeting;

    // Hero avatar
    const heroAv = document.getElementById('heroAvatar');
    if (userProfile?.avatar_url) heroAv.innerHTML = `<img src="${esc(userProfile.avatar_url)}" alt="">`;
    else if (currentUser) heroAv.innerHTML = (firstName || 'U')[0];
    else heroAv.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';

    // Header avatar
    const headerAv = document.getElementById('headerAvatar');
    headerAv.innerHTML = heroAv.innerHTML;
}

// ====== WEBGL SHADER ======
function initShader() {
    const container = document.getElementById('shader-bg');
    if (!container) return;
    const canvas = document.createElement('canvas');
    canvas.style.cssText = 'width:100%;height:100%';
    container.appendChild(canvas);
    const gl = canvas.getContext('webgl');
    if (!gl) return;

    const vsSource = `attribute vec4 aVertexPosition; void main() { gl_Position = aVertexPosition; }`;
    const fsSource = `
        precision highp float;
        uniform vec2 iResolution;
        uniform float iTime;
        const float overallSpeed = 0.04;
        const float gridSmoothWidth = 0.015;
        const float axisWidth = 0.05;
        const float majorLineWidth = 0.025;
        const float minorLineWidth = 0.0125;
        const float majorLineFrequency = 5.0;
        const float minorLineFrequency = 1.0;
        const float scale = 5.0;
        const vec4 lineColor = vec4(0.2, 0.4, 0.9, 1.0);
        const float minLineWidth = 0.01;
        const float maxLineWidth = 0.2;
        const float lineSpeed = 1.0 * overallSpeed;
        const float lineAmplitude = 1.0;
        const float lineFrequency = 0.2;
        const float warpSpeed = 0.2 * overallSpeed;
        const float warpFrequency = 0.5;
        const float warpAmplitude = 1.0;
        const float offsetFrequency = 0.5;
        const float offsetSpeed = 1.33 * overallSpeed;
        const float minOffsetSpread = 0.6;
        const float maxOffsetSpread = 2.0;
        const int linesPerGroup = 16;
        #define drawCircle(pos, radius, coord) smoothstep(radius + gridSmoothWidth, radius, length(coord - (pos)))
        #define drawSmoothLine(pos, halfWidth, t) smoothstep(halfWidth, 0.0, abs(pos - (t)))
        #define drawCrispLine(pos, halfWidth, t) smoothstep(halfWidth + gridSmoothWidth, halfWidth, abs(pos - (t)))
        #define drawPeriodicLine(freq, width, t) drawCrispLine(freq / 2.0, width, abs(mod(t, freq) - (freq) / 2.0))
        float random(float t) { return (cos(t) + cos(t * 1.3 + 1.3) + cos(t * 1.4 + 1.4)) / 3.0; }
        float getPlasmaY(float x, float horizontalFade, float offset) { return random(x * lineFrequency + iTime * lineSpeed) * horizontalFade * lineAmplitude + offset; }
        void main() {
            vec2 uv = gl_FragCoord.xy / iResolution.xy;
            vec2 space = (gl_FragCoord.xy - iResolution.xy / 2.0) / iResolution.x * 2.0 * scale;
            float horizontalFade = 1.0 - (cos(uv.x * 6.28) * 0.5 + 0.5);
            float verticalFade = 1.0 - (cos(uv.y * 6.28) * 0.5 + 0.5);
            space.y += random(space.x * warpFrequency + iTime * warpSpeed) * warpAmplitude * (0.5 + horizontalFade);
            space.x += random(space.y * warpFrequency + iTime * warpSpeed + 2.0) * warpAmplitude * horizontalFade;
            vec4 lines = vec4(0.0);
            vec4 bgColor1 = vec4(0.02, 0.05, 0.15, 1.0);
            vec4 bgColor2 = vec4(0.05, 0.15, 0.35, 1.0);
            for(int l = 0; l < linesPerGroup; l++) {
                float nli = float(l) / float(linesPerGroup);
                float oTime = iTime * offsetSpeed;
                float oPos = float(l) + space.x * offsetFrequency;
                float rand = random(oPos + oTime) * 0.5 + 0.5;
                float hw = mix(minLineWidth, maxLineWidth, rand * horizontalFade) / 2.0;
                float offset = random(oPos + oTime * (1.0 + nli)) * mix(minOffsetSpread, maxOffsetSpread, horizontalFade);
                float lp = getPlasmaY(space.x, horizontalFade, offset);
                float line = drawSmoothLine(lp, hw, space.y) / 2.0 + drawCrispLine(lp, hw * 0.15, space.y);
                float cx = mod(float(l) + iTime * lineSpeed, 25.0) - 12.0;
                vec2 cp = vec2(cx, getPlasmaY(cx, horizontalFade, offset));
                line += drawCircle(cp, 0.01, space) * 4.0;
                lines += line * lineColor * rand;
            }
            vec4 fragColor = mix(bgColor1, bgColor2, uv.x);
            fragColor *= verticalFade;
            fragColor.a = 1.0;
            fragColor += lines;
            gl_FragColor = fragColor;
        }`;

    function loadShader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; } return s; }
    const vs = loadShader(gl.VERTEX_SHADER, vsSource), fs = loadShader(gl.FRAGMENT_SHADER, fsSource);
    if (!vs || !fs) return;
    const prog = gl.createProgram(); gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
    const posLoc = gl.getAttribLocation(prog, 'aVertexPosition');
    const resLoc = gl.getUniformLocation(prog, 'iResolution');
    const timeLoc = gl.getUniformLocation(prog, 'iTime');
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; gl.viewport(0, 0, canvas.width, canvas.height); }
    resize(); window.addEventListener('resize', resize);
    const t0 = Date.now();
    (function render() { requestAnimationFrame(render); gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); gl.useProgram(prog); gl.uniform2f(resLoc, canvas.width, canvas.height); gl.uniform1f(timeLoc, (Date.now()-t0)/1000); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0); gl.enableVertexAttribArray(posLoc); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); })();
}
